<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMU Exams Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #f8fafc);
      min-height: 100vh; color: #0f172a;
    }
    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 20px; }
    header a { color: #fff; text-decoration: none; font-weight: 600; border: 1px solid rgba(255,255,255,0.6);
      padding: 6px 14px; border-radius: 8px; }
    header a:hover { background: rgba(255,255,255,0.15); }
    main { max-width: 760px; margin: 30px auto; padding: 0 16px; }
    .card {
      background: rgba(255,255,255,0.98); border: 1px solid #dbe4f0; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.08); padding: 28px; margin-bottom: 20px;
    }
    .card h2 { font-size: 22px; margin-bottom: 12px; }
    .card p { font-size: 15px; line-height: 1.6; color: #334155; margin-bottom: 10px; }
    .programme { font-weight: 600; color: #1d4ed8; }
    .pay-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .pay-row input {
      flex: 1; min-width: 200px; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; font-size: 14px; background: #f8fbff;
    }
    button, .btn {
      padding: 12px 20px; background: linear-gradient(135deg, #16a34a, #15803d); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .status.ok { color: #15803d; }
    .status.error { color: #b91c1c; }
    .unit {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-top: 12px;
      background: #f8fbff; flex-wrap: wrap;
    }
    .unit-info strong { display: block; font-size: 15px; }
    .unit-info span { font-size: 14px; color: #475569; }
    .unit button { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 10px 16px; font-size: 14px; }
    .unit button:disabled { background: #94a3b8; }
    .unit .na { font-size: 13px; color: #64748b; font-style: italic; }
    .empty { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>TMU Exams Papers</h1>
    <a href="/logout">Logout</a>
  </header>

  <main id="content">
    <div class="card"><p>Loading...</p></div>
  </main>

  <script>
    const content = document.getElementById("content");

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "text") node.textContent = v;
        else if (k === "className") node.className = v;
        else node[k] = v;
      });
      children.forEach(c => node.appendChild(c));
      return node;
    }

    function setStatus(node, message, type) {
      node.textContent = message;
      node.className = "status " + (type || "");
    }

    // Unpaid view: welcome message and M-Pesa payment
    function renderLocked(data) {
      const statusNode = el("div", { className: "status" });
      const phoneInput = el("input", { type: "tel", placeholder: "M-Pesa number e.g. 0712345678" });
      const payButton = el("button", { type: "button", text: `Pay Ksh ${data.unlockFee} with M-Pesa` });

      payButton.addEventListener("click", async () => {
        const phone = phoneInput.value.trim();
        if (!phone) return setStatus(statusNode, "Enter your M-Pesa number first.", "error");

        payButton.disabled = true;
        setStatus(statusNode, "⏳ Sending M-Pesa prompt to your phone...");
        try {
          const res = await fetch("/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone })
          });
          const response = await res.json();
          if (!response.success) throw new Error(response.message);

          if (response.message === "already_paid") return await load();
          setStatus(statusNode, "📲 Enter your M-Pesa PIN on your phone. This page will unlock once payment is confirmed.", "ok");
          await waitForPayment(statusNode);
        } catch (err) {
          setStatus(statusNode, err.message, "error");
          payButton.disabled = false;
        }
      });

      content.replaceChildren(
        el("div", { className: "card" }, [
          el("h2", { text: `Hi, ${data.fullname}!` }),
          el("p", { text: "Welcome to TMU Exams papers." }),
          el("p", { text: `Kindly pay a fee of Ksh ${data.unlockFee} to unlock your units' exam papers.` }),
          el("p", { className: "programme", text: data.programme ? `Programme: ${data.programme}` : "" }),
          el("div", { className: "pay-row" }, [phoneInput, payButton]),
          statusNode
        ])
      );

      if (!data.programme) {
        content.prepend(el("div", { className: "card" }, [
          el("p", { className: "empty", text: "Your programme is not recognised. Please contact the administrator." })
        ]));
      }
    }

    // Paid view: list the student's units with PDF downloads
    function renderUnlocked(data) {
      const unitCards = data.units.map(unit => {
        const action = unit.available
          ? el("button", { type: "button", text: "Download PDF" })
          : el("span", { className: "na", text: "Paper not yet available" });

        if (unit.available) {
          action.addEventListener("click", () => downloadUnit(unit, action));
        }

        return el("div", { className: "unit" }, [
          el("div", { className: "unit-info" }, [
            el("strong", { text: `${unit.code}` }),
            el("span", { text: unit.title })
          ]),
          action
        ]);
      });

      content.replaceChildren(
        el("div", { className: "card" }, [
          el("h2", { text: `Hi, ${data.fullname}!` }),
          el("p", { text: "Welcome to TMU Exams papers. Your units are unlocked, download each exam paper as PDF below." }),
          el("p", { className: "programme", text: data.programme ? `Programme: ${data.programme}` : "" }),
          ...unitCards
        ])
      );
    }

    async function downloadUnit(unit, button) {
      button.disabled = true;
      try {
        const res = await fetch(unit.url);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || "Download failed.");
        }
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = unit.filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      } catch (err) {
        alert(err.message);
      } finally {
        button.disabled = false;
      }
    }

    // Poll until the KCB callback marks the account as paid (up to ~3 minutes)
    async function waitForPayment(statusNode) {
      for (let i = 0; i < 36; i++) {
        await new Promise(r => setTimeout(r, 5000));
        const res = await fetch("/api/programme");
        const data = await res.json();
        if (data.paid) return load();
      }
      setStatus(statusNode, "Payment not confirmed yet. If you paid, refresh this page in a minute.", "error");
    }

    async function load() {
      try {
        const res = await fetch("/api/programme");
        if (res.status === 401) return (window.location.href = "/index.html");
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        if (data.paid) renderUnlocked(data);
        else renderLocked(data);
      } catch (err) {
        content.replaceChildren(el("div", { className: "card" }, [
          el("p", { className: "empty", text: "❌ " + err.message })
        ]));
      }
    }

    load();
  </script>
</body>
</html>
