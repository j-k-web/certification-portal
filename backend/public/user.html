<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registry Directory Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Times New Roman", Times, serif;
      background: #f4f6f9;
      padding: 40px;
      color: #2c3e50;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 3px solid #115201;
      padding-bottom: 15px;
    }
    h1 { color: #115201; font-size: 32px; }
    .back-btn {
      padding: 10px 20px;
      background: #2c3e50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 18px;
    }
    .back-btn:hover { background: #1a252f; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    tr:hover { background-color: #f9f9f9; }
    .badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
    }
    .badge.paid { background: #d4edda; color: #155724; }
    .badge.unpaid { background: #f8d7da; color: #721c24; }
    #errorMessage { color: #c0392b; font-weight: bold; margin-bottom: 20px; }
    
    /* Delete Action Button Styling */
    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 4px;
      font-family: "Times New Roman", Times, serif;
      transition: background 0.2s;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
    .summary { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .card { background: #fff; padding: 18px 24px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); min-width: 200px; }
    .card .label { font-size: 16px; color: #666; }
    .card .value { font-size: 34px; font-weight: bold; color: #115201; }
    .card.pending .value { color: #b03a2e; }
    .toolbar { margin-bottom: 15px; font-size: 20px; }
    .toolbar select { font-family: inherit; font-size: 18px; padding: 6px 10px; }
    .muted { color: #777; font-size: 16px; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>👤 Registered Users & Payment Directory</h1>
    <a href="/dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>
  </div>

  <div id="errorMessage"></div>

  <div class="summary">
    <div class="card"><div class="label">Registered</div><div class="value" id="countAll">0</div></div>
    <div class="card"><div class="label">Paid</div><div class="value" id="countPaid">0</div></div>
    <div class="card pending"><div class="label">Pending</div><div class="value" id="countPending">0</div></div>
  </div>

  <div class="toolbar">
    Show:
    <select id="statusFilter" onchange="renderTable()">
      <option value="all">All users</option>
      <option value="paid">Paid only</option>
      <option value="pending">Pending only</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Full Name</th>
        <th>Email Address</th>
        <th>Phone Number</th>
        <th>Programme</th>
        <th>Payment Status</th>
        <th>Amount Paid</th>
        <th>Paid On</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userTableBody">
      <tr>
        <td colspan="8" style="text-align: center;">Loading user records from database...</td>
      </tr>
    </tbody>
  </table>

  <script>
    const FEE_KSH = 500;
    let allUsers = [];

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatDate(value) {
      if (!value) return '—';
      return new Date(value).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      const filter = document.getElementById('statusFilter').value;

      const paidCount = allUsers.filter(u => u.paid).length;
      document.getElementById('countAll').innerText = allUsers.length;
      document.getElementById('countPaid').innerText = paidCount;
      document.getElementById('countPending').innerText = allUsers.length - paidCount;

      const shown = allUsers.filter(u =>
        filter === 'all' ? true : filter === 'paid' ? !!u.paid : !u.paid
      );

      if (shown.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No users to show.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      shown.forEach(user => {
        const isPaid = !!user.paid;
        const statusBadge = isPaid
          ? '<span class="badge paid">✅ Paid</span>'
          : '<span class="badge unpaid">⏳ Pending</span>';
        const amountText = isPaid ? `Ksh ${FEE_KSH}` : 'Ksh 0';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${esc(user.fullname)}</strong></td>
          <td>${esc(user.email)}</td>
          <td>${esc(user.phone || 'N/A')}</td>
          <td>${esc(user.specialization || 'N/A')}</td>
          <td>${statusBadge}</td>
          <td><strong>${amountText}</strong></td>
          <td>${isPaid ? formatDate(user.paidAt) : '<span class="muted">—</span>'}</td>
          <td><button class="delete-btn" onclick="deleteUser('${esc(user._id)}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function fetchUsers() {
      try {
        const res = await fetch('/api/admin/users');

        if (res.status === 401 || res.status === 403 || res.status === 404) {
          document.getElementById('errorMessage').innerText = `⚠️ Security Auth Error ${res.status}. Redirecting to safety gateway...`;
          setTimeout(() => { window.location.href = '/index.html'; }, 3000);
          return;
        }

        const textResponse = await res.text();
        let response;
        try {
          response = JSON.parse(textResponse);
        } catch (parseErr) {
          console.error("Server raw response was:", textResponse);
          document.getElementById('errorMessage').innerText = `❌ Server didn't send JSON data. It sent: "${textResponse.substring(0, 60)}..."`;
          return;
        }

        if (response.success) {
          allUsers = response.data;
          renderTable();
        } else {
          document.getElementById('errorMessage').innerText = response.message;
        }
      } catch (err) {
        document.getElementById('errorMessage').innerText = "❌ Error fetching directory lists: " + err.message;
      }
    }

    // 🗑️ Permanent User Deletion Controller Loop
    async function deleteUser(userId) {
      if (!confirm("⚠️ Are you absolutely sure you want to permanently delete this user entry? This action cannot be undone.")) return;
      
      try {
        const res = await fetch(`/api/admin/users/${userId}`, {
          method: 'DELETE'
        });
        const result = await res.json();
        
        if (result.success) {
          alert(result.message);
          fetchUsers(); // Instantly refresh table visualization mapping updates
        } else {
          alert("❌ Error: " + result.message);
        }
      } catch (err) {
        alert("❌ Error processing network database transaction: " + err.message);
      }
    }

    // Run fetch execution directly when content loads
    window.onload = fetchUsers;
  </script>
</body>
</html>
