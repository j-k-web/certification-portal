<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registry Directory Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Times New Roman", Times, serif;
      background: #f4f6f9;
      padding: 40px;
      color: #2c3e50;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 3px solid #115201;
      padding-bottom: 15px;
    }
    h1 { color: #115201; font-size: 28px; }
    .back-btn {
      padding: 10px 20px;
      background: #2c3e50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 16px;
    }
    .back-btn:hover { background: #1a252f; }

    .summary-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .summary-card {
      background: #fff;
      border-radius: 8px;
      padding: 14px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 16px;
      min-width: 160px;
    }
    .summary-card span { font-size: 24px; font-weight: bold; display: block; color: #115201; }

    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      min-width: 900px;
    }
    th, td {
      padding: 13px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 15px;
    }
    th {
      background-color: #2c3e50;
      color: white;
      white-space: nowrap;
    }
    tr:hover { background-color: #f9f9f9; }

    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
    }
    .badge.paid { background: #d4edda; color: #155724; }
    .badge.unpaid { background: #f8d7da; color: #721c24; }

    .mpesa-code {
      font-family: monospace;
      font-size: 14px;
      background: #eef7ee;
      color: #115201;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    #errorMessage { color: #c0392b; font-weight: bold; margin-bottom: 20px; }

    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      font-family: "Times New Roman", Times, serif;
      transition: background 0.2s;
    }
    .delete-btn:hover { background: #c0392b; }

    .search-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-bar input {
      padding: 9px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      width: 280px;
      font-family: "Times New Roman", Times, serif;
    }
    .search-bar select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      font-family: "Times New Roman", Times, serif;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>👤 Registered Users &amp; Payment Directory</h1>
    <a href="/dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>
  </div>

  <div id="errorMessage"></div>

  <div class="summary-bar">
    <div class="summary-card">Total Users<span id="totalCount">—</span></div>
    <div class="summary-card">Paid<span id="paidCount">—</span></div>
    <div class="summary-card">Unpaid<span id="unpaidCount">—</span></div>
    <div class="summary-card">Revenue<span id="totalRevenue">—</span></div>
  </div>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Search name, email, phone, code..." oninput="filterTable()" />
    <select id="filterStatus" onchange="filterTable()">
      <option value="all">All Users</option>
      <option value="paid">Paid Only</option>
      <option value="unpaid">Unpaid Only</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Full Name</th>
          <th>Email Address</th>
          <th>Phone Number</th>
          <th>Specialization</th>
          <th>Payment Status</th>
          <th>Amount Paid</th>
          <th>M-PESA Code</th>
          <th>Payment Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr>
          <td colspan="10" style="text-align:center;">Loading user records from database...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let allUsers = [];

    async function fetchUsers() {
      try {
        const res = await fetch('/api/admin/users');

        if (res.status === 401 || res.status === 403 || res.status === 404) {
          document.getElementById('errorMessage').innerText =
            `⚠️ Security Auth Error ${res.status}. Redirecting to safety gateway...`;
          setTimeout(() => { window.location.href = '/index.html'; }, 3000);
          return;
        }

        const textResponse = await res.text();
        let response;
        try {
          response = JSON.parse(textResponse);
        } catch (parseErr) {
          document.getElementById('errorMessage').innerText =
            `❌ Server didn't send JSON. Got: "${textResponse.substring(0, 80)}..."`;
          return;
        }

        if (response.success) {
          allUsers = response.data;
          updateSummary(allUsers);
          renderTable(allUsers);
        } else {
          document.getElementById('errorMessage').innerText = response.message;
        }
      } catch (err) {
        document.getElementById('errorMessage').innerText = "❌ Error fetching directory: " + err.message;
      }
    }

    function updateSummary(users) {
      const paid = users.filter(u => u.paid);
      document.getElementById('totalCount').textContent = users.length;
      document.getElementById('paidCount').textContent = paid.length;
      document.getElementById('unpaidCount').textContent = users.length - paid.length;
      document.getElementById('totalRevenue').textContent = 'Ksh ' + (paid.length * 200).toLocaleString();
    }

    function renderTable(users) {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">No users found.</td></tr>`;
        return;
      }

      users.forEach((user, index) => {
        const tr = document.createElement('tr');
        const isPaid = user.paid || false;
        const statusBadge = isPaid
          ? '<span class="badge paid">✅ Completed</span>'
          : '<span class="badge unpaid">⏳ Pending</span>';
        const amountText = isPaid ? 'Ksh 200' : '—';
        const mpesaCode = user.mpesaCode
          ? `<span class="mpesa-code">${user.mpesaCode}</span>`
          : '<span style="color:#aaa;">—</span>';
        const paidAt = user.paidAt
          ? new Date(user.paidAt).toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' })
          : '—';

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${user.fullname}</strong></td>
          <td>${user.email}</td>
          <td>${user.phone || 'N/A'}</td>
          <td>${user.specialization ? user.specialization.toUpperCase() : 'N/A'}</td>
          <td>${statusBadge}</td>
          <td><strong>${amountText}</strong></td>
          <td>${mpesaCode}</td>
          <td>${paidAt}</td>
          <td>
            <button class="delete-btn" onclick="deleteUser('${user._id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;

      const filtered = allUsers.filter(user => {
        const matchesSearch =
          (user.fullname || '').toLowerCase().includes(query) ||
          (user.email || '').toLowerCase().includes(query) ||
          (user.phone || '').toLowerCase().includes(query) ||
          (user.mpesaCode || '').toLowerCase().includes(query) ||
          (user.specialization || '').toLowerCase().includes(query);

        const matchesStatus =
          status === 'all' ||
          (status === 'paid' && user.paid) ||
          (status === 'unpaid' && !user.paid);

        return matchesSearch && matchesStatus;
      });

      renderTable(filtered);
      updateSummary(filtered);
    }

    async function deleteUser(userId) {
      if (!confirm("⚠️ Are you sure you want to permanently delete this user? This cannot be undone.")) return;

      try {
        const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          alert(result.message);
          fetchUsers();
        } else {
          alert("❌ Error: " + result.message);
        }
      } catch (err) {
        alert("❌ Network error: " + err.message);
      }
    }

    window.onload = fetchUsers;
  </script>
</body>
</html>
