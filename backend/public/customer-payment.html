<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Payment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .amount-display {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 20px;
    }

    .amount-display .label {
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .amount-display .value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-pay {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-pay:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-clear {
      background: #f0f0f0;
      color: #333;
    }

    .btn-clear:hover {
      background: #e0e0e0;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .info-box {
      background: #f0f7ff;
      border-left: 4px solid #667eea;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
    }

    .info-box strong {
      color: #333;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💳 Customer Payment</h1>
      <p>Pay any amount securely via M-PESA</p>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <div class="info-box">
      <strong>ℹ️ How it works:</strong> Enter your details, confirm the amount, and you'll receive an M-PESA STK prompt on your phone.
    </div>

    <form id="paymentForm">
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" placeholder="254724464455 or 0724464455" required>
        <small style="color: #999; margin-top: 4px; display: block;">Start with 254 or 0</small>
      </div>

      <div class="form-group">
        <label for="amount">Amount (KES) *</label>
        <input type="number" id="amount" name="amount" placeholder="Enter amount in Kenyan Shillings" min="1" required>
      </div>

      <div class="amount-display">
        <div class="label">Total Amount</div>
        <div class="value" id="totalDisplay">KES 0</div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-pay" id="payBtn">Pay KES <span id="payAmount">0</span></button>
        <button type="reset" class="btn-clear">Clear</button>
      </div>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Processing payment...</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('paymentForm');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    const loadingDiv = document.getElementById('loading');
    const amountInput = document.getElementById('amount');
    const payBtn = document.getElementById('payBtn');
    const totalDisplay = document.getElementById('totalDisplay');
    const payAmount = document.getElementById('payAmount');

    // Update amount display in real-time
    amountInput.addEventListener('input', () => {
      const amount = parseInt(amountInput.value) || 0;
      totalDisplay.textContent = `KES ${amount.toLocaleString()}`;
      payAmount.textContent = amount.toLocaleString();
    });

    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      const phone = document.getElementById('phone').value.trim();
      const amount = document.getElementById('amount').value.trim();

      // Validate
      if (!phone || !amount) {
        showError('Phone number and amount are required.');
        return;
      }

      if (parseInt(amount) < 1) {
        showError('Amount must be at least KES 1.');
        return;
      }

      // Show loading
      loadingDiv.style.display = 'block';
      payBtn.disabled = true;

      try {
        const response = await fetch('/customer-pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount })
        });

        const data = await response.json();

        if (data.success) {
          showSuccess(`✅ M-PESA prompt sent to ${phone}. Enter your PIN to complete payment.`);
          form.reset();
          totalDisplay.textContent = 'KES 0';
          payAmount.textContent = '0';
        } else {
          showError(data.message || 'Payment failed. Please try again.');
        }
      } catch (err) {
        showError('Network error. Please check your connection and try again.');
        console.error('Payment error:', err);
      } finally {
        loadingDiv.style.display = 'none';
        payBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSuccess(msg) {
      successDiv.textContent = msg;
      successDiv.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
