<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #f8fafc);
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.98);
      padding: 38px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      width: 380px;
      text-align: center;
      border: 1px solid #dbe4f0;
    }
    .container h2 { margin-bottom: 20px; font-size: 26px; color: #0f172a; }
    .container input[type="email"], .container input[type="password"] {
      width: 100%; padding: 12px 14px; margin: 10px 0;
      border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px;
      background: #f8fbff;
    }
    .container button {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; cursor: pointer;
      transition: background 0.3s;
      font-weight: 700;
    }
    .container button:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
    .link { margin-top: 15px; font-size: 14px; color: #475569; }
    .link a { color: #2563eb; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
    #loginMessage { margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div id="loginMessage"></div>
    <div class="link">
      <p>Not registered? <a href="register.html">Click here to register</a></p>
      <p style="margin-top: 10px;">Forgot password? <a href="forgot.html">Reset it here</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      };

      const msgElement = document.getElementById("loginMessage");
      msgElement.style.color = "black";
      msgElement.innerText = "⏳ Authenticating...";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const response = await res.json();

        if (response.success) {
          msgElement.style.color = "#27ae60";
          msgElement.innerText = "✅ Login successful! Redirecting...";
          sessionStorage.setItem("loginName", response.fullname);
          sessionStorage.setItem("loginSpec", response.specialization);
          setTimeout(() => {
            window.location.href = "/dashboard.html";
          }, 1000);
        } else {
          msgElement.style.color = "#c0392b";
          msgElement.innerText = response.message;
        }
      } catch (err) {
        msgElement.style.color = "#c0392b";
        msgElement.innerText = "❌ Connection error: " + err.message;
      }
    });
  </script>
</body>
</html>
